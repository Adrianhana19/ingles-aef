G({id:'2-2c',book:2,file:2,title:'Time sequencers & connectors',es:'Secuenciadores y conectores',
form:[['i','Secuencia: first · then · next · after that · later · finally · when'],['i','Conectores: because (porque) · so (así que) · but (pero) · although (aunque)']],
uses:['Ordenar una historia en el pasado.','<b>so</b> = resultado; <b>because</b> = causa.'],
ex:[['First we had dinner, then we went to a club.','Primero cenamos, luego fuimos a un club.'],['I was tired, so I went to bed early.','Estaba cansado, así que me fui a dormir temprano.'],['Although it was cold, we went to the beach.','Aunque hacía frío, fuimos a la playa.']],
errs:[['I was hungry, because I ate.','I was hungry, so I ate.','Resultado → so.']],
items:['m:It was raining, [so|because|although] we stayed at home.','m:I went to bed early [because|so|but] I was tired.','m:[Although|So|Because] he was sick, he went to work.','m:I called her, [but|so|because] she didn\'t answer.','g:First I had a shower. {Then|After that|Next} I got dressed.','e:I was late *so>because* I missed the bus.','t:Estaba cansada, así que me fui a dormir. = I was tired, so I went to bed.','o:After that we went back to the hotel.']});

G({id:'2-3a',book:2,file:3,title:'be going to (plans & predictions)',es:'Going to: planes y predicciones',
form:[['p','I\'m going to + base'],['n','I\'m not going to…'],['q','Are you going to…?'],['i','Vocab aeropuerto: check in, go through security, boarding pass, gate, departures, arrivals, baggage claim, customs']],
uses:['Planes decididos: <i>I\'m going to apply for a visa.</i>','Predicción con evidencia: <i>The plane is going to be late.</i>','Con go se suele decir <i>I\'m going to the airport</i> (sin "going to go").'],
ex:[['We\'re going to check in online.','Vamos a hacer el check-in en línea.'],['Hurry! We\'re going to miss the flight!','¡Apúrate! ¡Vamos a perder el vuelo!'],['I\'m not going to take a lot of luggage.','No voy a llevar mucho equipaje.']],
errs:[['I going to travel.','I\'m going to travel.','Falta be.']],
items:['m:Look at the screen. Our flight [is going to|going to|goes to] be delayed.','m:What [are you going to|you going to|do you going to] do in New York?','g:I {\'m not going to|am not going to} (not) check any bags.','g:{Are} you going to rent a car?','e:We *are going to going>are going* to the airport at 5.','e:She is going *buy>to buy* a new suitcase.','t:Vamos a perder el vuelo. = We\'re going to miss the flight.|We are going to miss the flight.','o:I am going to show my boarding pass.']});

G({id:'2-3b',book:2,file:3,title:'Present continuous (future arrangements)',es:'Presente continuo para el futuro',
form:[['p','I\'m meeting Ana tomorrow. (está organizado)'],['i','Necesita expresión de futuro: tomorrow, on Friday, next week, tonight']],
uses:['Planes ya acordados con otra persona, hora o lugar (como en una agenda).','Verbs + prepositions: arrive in/at, ask for, talk to, wait for, worry about, think about.'],
ex:[['I\'m having dinner with my parents on Saturday.','Voy a cenar con mis papás el sábado.'],['What are you doing tonight?','¿Qué vas a hacer esta noche?'],['We\'re flying to Miami next week.','Volamos a Miami la próxima semana.']],
errs:[['I meet my friend tomorrow.','I\'m meeting my friend tomorrow.','Plan acordado → continuo.'],['I\'m waiting you.','I\'m waiting for you.','wait for.']],
items:['m:What [are you doing|do you do|you doing] this weekend?','m:I [\'m meeting|meet|meeting] my boss at 3:00 tomorrow.','m:We\'re waiting [for|to|—] the bus.','m:Don\'t worry [about|for|of] me.','g:They {\'re getting married|are getting married} (get married) in December.','g:She arrives {in} San Salvador on Tuesday. ## arrive in + ciudad/país','e:I *see>\'m seeing* the dentist tomorrow at 10.','e:Can I talk *with>to* you for a minute?','t:¿Qué vas a hacer esta noche? = What are you doing tonight?|What are you going to do tonight?','o:We are having a party on Friday.']});

G({id:'2-3c',book:2,file:3,title:'Defining relative clauses',es:'Cláusulas relativas: who, which, where',
form:[['i','who → personas: a person who…'],['i','which / that → cosas: a thing which/that…'],['i','where → lugares: a place where…']],
uses:['Para definir o explicar una palabra que no sabes (paraphrasing): <i>It\'s a thing which you use to open a bottle.</i>'],
ex:[['A chef is a person who cooks in a restaurant.','Un chef es una persona que cocina en un restaurante.'],['It\'s a machine which washes clothes.','Es una máquina que lava ropa.'],['A library is a place where you can borrow books.','Una biblioteca es un lugar donde puedes pedir libros prestados.']],
errs:[['a person which…','a person who…','Personas → who.'],['a place which you can swim','a place where you can swim','Lugar → where.']],
items:['m:A dentist is a person [who|which|where] takes care of your teeth.','m:A key is a thing [which|who|where] opens a door.','m:A gym is a place [where|which|who] you can exercise.','m:That\'s the man [who|which|where] lives next door.','g:This is the restaurant {where} we had our first date.','g:I have a friend {who|that} speaks five languages.','e:A pilot is a person *which>who* flies planes.','t:Es un lugar donde puedes comprar medicina. = It\'s a place where you can buy medicine.|It is a place where you can buy medicine.','o:It is something which you use to cut paper.']});

G({id:'2-4a',book:2,file:4,title:'Present perfect + yet, just, already',es:'Presente perfecto con yet / just / already',
form:[['p','I\'ve just finished. (hace un momento) · I\'ve already done it. (ya)'],['n','I haven\'t done it yet. (todavía no)'],['q','Have you done it yet? (¿ya…?)'],['i','just / already: entre have y participio · yet: al final']],
uses:['Acciones recientes con resultado ahora.','Housework con make y do: make the bed, make dinner, do the dishes, do the laundry, do the ironing.'],
ex:[['I\'ve just made dinner.','Acabo de hacer la cena.'],['Have you done your homework yet?','¿Ya hiciste tu tarea?'],['She hasn\'t cleaned her room yet.','Ella todavía no ha limpiado su cuarto.'],['We\'ve already paid.','Ya pagamos.']],
errs:[['I have yet finished.','I haven\'t finished yet.','yet al final y en negativo/pregunta.'],['I\'ve made the laundry.','I\'ve done the laundry.','do the laundry.']],
items:['m:I\'ve [just|yet|still] had lunch, so I\'m not hungry.','m:Have you finished [yet|already|just]?','m:She has [already|yet|still] seen that movie.','m:Have you [done|made|did] the dishes?','m:Can you [make|do|put] your bed, please?','g:I haven\'t called him {yet}.','g:They {\'ve just arrived|have just arrived} (just/arrive).','e:I *have done>made* dinner for everyone.','e:Have you finished *already>yet*?','t:Ya hice mi tarea. = I\'ve already done my homework.|I have already done my homework.','t:¿Ya comiste? = Have you eaten yet?|Have you had lunch yet?','o:We have just bought a new washing machine.']});

G({id:'2-4b',book:2,file:4,title:'Present perfect or past simple? (shopping)',es:'Presente perfecto vs. pasado simple',
form:[['i','PP: sin tiempo, experiencia o resultado → I\'ve bought some shoes online.'],['i','PS: tiempo definido, detalles → I bought them last week. Where did you buy them?']],
uses:['Vocab compras: try on, fit, return, refund, receipt, size, sale, deliver, order online.'],
ex:[['Have you ever bought clothes online? – Yes, I bought a jacket last month.','¿Alguna vez has comprado ropa en línea? – Sí, compré una chaqueta el mes pasado.'],['I\'ve lost my receipt.','Perdí mi recibo (y aún no lo tengo).'],['Did they deliver it on time?','¿Lo entregaron a tiempo?']],
errs:[['I have bought it yesterday.','I bought it yesterday.','yesterday → pasado simple.']],
items:['m:I [bought|have bought|buy] these shoes last Saturday.','m:[Have you ever returned|Did you ever return|Have you ever return] something to a store?','m:Can I [try on|try|try in] these jeans?','m:These pants don\'t [fit|wear|try] me. They\'re too small.','g:I {\'ve never ordered|have never ordered} (never/order) food online.','g:When {did} you buy that dress?','e:I *have lost>lost* my wallet yesterday.','t:¿Me lo puedo probar? = Can I try it on?','o:Have you ever bought something you never used?']});

G({id:'2-4c',book:2,file:4,title:'something / anything / nothing',es:'Pronombres indefinidos',
form:[['p','something · somebody/someone · somewhere'],['n','not…anything / anybody / anywhere'],['i','nothing · nobody · nowhere (con verbo afirmativo)'],['q','anything? anybody? anywhere?']],
uses:['En inglés no hay doble negación: <i>I didn\'t see anything</i> o <i>I saw nothing</i> (nunca "didn\'t see nothing").','Adjetivos -ed (cómo me siento) y -ing (cómo es algo): bored/boring, tired/tiring, interested/interesting.'],
ex:[['There\'s somebody at the door.','Hay alguien en la puerta.'],['I didn\'t buy anything.','No compré nada.'],['Nobody called.','Nadie llamó.'],['The movie was boring, so I was bored.','La película era aburrida, así que estaba aburrido.']],
errs:[['I didn\'t see nothing.','I didn\'t see anything.','No doble negación.'],['I\'m boring.','I\'m bored.','-ed = cómo te sientes.']],
items:['m:Is there [anything|something|nothing] in the fridge?','m:I didn\'t go [anywhere|nowhere|somewhere] last weekend.','m:[Nobody|Anybody|Somebody] came to the meeting. It was empty!','m:The class was very [boring|bored|bore].','m:I was very [interested|interesting|interest] in the lesson.','g:I want to eat {something}. I\'m hungry.','e:I didn\'t say *nothing>anything*.','e:I\'m very *tiring>tired* today.','t:No vi a nadie. = I didn\'t see anybody.|I didn\'t see anyone.|I saw nobody.','o:Did anybody call me this morning?']});

G({id:'2-5a',book:2,file:5,title:'Comparatives, as…as',es:'Comparativos de adjetivos y adverbios; as…as',
form:[['i','adj: faster, more relaxed · adv: more slowly, harder, better'],['i','as + adj/adv + as = tan… como: I\'m as tall as my dad.'],['n','not as…as: My car isn\'t as fast as yours.']],
uses:['Expresiones de tiempo: spend time, waste time, save time, on time, in time, have time.'],
ex:[['People walk faster in big cities.','La gente camina más rápido en las ciudades grandes.'],['She isn\'t as busy as me.','Ella no está tan ocupada como yo.'],['I spend too much time on my phone.','Paso demasiado tiempo en mi teléfono.']],
errs:[['as tall than','as tall as','as…as.'],['more fast','faster','Corto → -er.']],
items:['m:He drives [more carefully|carefullier|more careful] than me.','m:My brother isn\'t [as tall as|as tall than|so tall that] me.','m:I work [harder|more hard|hardlier] than my boss.','m:Don\'t [waste|spend|lose] time watching TV.','g:Life in the country is {more relaxed} (relaxed) than in the city.','g:Ana speaks English {better} (well) than her husband.','e:This bag is as heavy *than>as* that one.','e:I always arrive *in>on* time for class.','t:No soy tan alto como mi papá. = I\'m not as tall as my dad.|I am not as tall as my father.','o:She speaks more quickly than me.']});

G({id:'2-5b',book:2,file:5,title:'Superlatives (+ ever + present perfect)',es:'Superlativos + ever',
form:[['i','the + -est / the most + adj'],['p','It\'s the best movie I\'ve ever seen. (que he visto en mi vida)']],
uses:['Describir una ciudad: crowded, polluted, safe, dangerous, noisy, exciting, historic.'],
ex:[['It\'s the most beautiful city I\'ve ever visited.','Es la ciudad más bonita que he visitado.'],['What\'s the best meal you\'ve ever had?','¿Cuál es la mejor comida que has comido?'],['This is the most polluted area in the city.','Esta es la zona más contaminada de la ciudad.']],
errs:[['the best movie I ever saw','the best movie I\'ve ever seen','superlativo + present perfect.']],
items:['m:It\'s the [most crowded|crowdest|more crowded] city I\'ve ever been to.','m:That\'s the best book I\'ve ever [read|readed|reading].','m:What\'s the [scariest|most scary|scarier] movie you\'ve ever seen?','g:It\'s the {worst} (bad) meal I\'ve ever eaten.','g:She\'s the {funniest} (funny) person I\'ve ever met.','e:It\'s the *more>most* polluted city in the world.','t:Es la mejor película que he visto. = It\'s the best movie I\'ve ever seen.|It is the best movie I have ever seen.','o:What is the most exciting city you have ever visited?']});

G({id:'2-5c',book:2,file:5,title:'Quantifiers, too, not enough',es:'Cuantificadores: too, too much/many, (not) enough',
form:[['i','too + adj: too hot (demasiado)'],['i','too much + incontable · too many + plural'],['i','enough + noun: enough money · adj + enough: old enough'],['n','not enough: I don\'t sleep enough.'],['i','a little (incontable) · a few (plural)']],
uses:['Hablar de salud y hábitos: <i>I eat too much sugar. I don\'t drink enough water.</i>'],
ex:[['I drink too much coffee.','Tomo demasiado café.'],['There are too many cars.','Hay demasiados carros.'],['He isn\'t old enough to drive.','No tiene edad suficiente para manejar.'],['I have a few friends here.','Tengo unos pocos amigos aquí.']],
errs:[['too much people','too many people','Plural → many.'],['enough old','old enough','Adjetivo + enough.']],
items:['m:I eat [too much|too many|too] sugar.','m:There are [too many|too much|too] people here.','m:This coffee is [too|too much|enough] hot. I can\'t drink it.','m:I don\'t sleep [enough|too|enough of].','m:She isn\'t [old enough|enough old|too old] to vote.','m:Can I have [a little|a few|many] milk in my tea?','g:I have {a few} friends who speak English. (unos pocos)','e:I don\'t have *money enough>enough money*.','e:There\'s *too many>too much* noise.','t:Tomo demasiado café. = I drink too much coffee.','o:I do not drink enough water.']});

G({id:'2-6a',book:2,file:6,title:'will / won\'t (predictions)',es:'Will para predicciones',
form:[['p','I/you/he… will (\'ll) + base'],['n','won\'t (will not) + base'],['q','Will it…? – Yes, it will. / No, it won\'t.'],['i','I think… will · I don\'t think… will (no "I think… won\'t")']],
uses:['Predicciones u opiniones sobre el futuro: <i>I think it\'ll be sunny tomorrow.</i>','Opposite verbs: win/lose, pass/fail, remember/forget, push/pull, buy/sell, teach/learn.'],
ex:[['You\'ll love this movie.','Te va a encantar esta película.'],['I don\'t think she\'ll come.','No creo que ella venga.'],['Will you pass the exam?','¿Pasarás el examen?']],
errs:[['I think she won\'t come.','I don\'t think she\'ll come.','Más natural con don\'t think.'],['It will to rain.','It will rain.','Sin to.']],
items:['m:I think you [\'ll pass|pass|\'re pass] the exam.','m:I don\'t think it [will|won\'t|is] rain tomorrow.','m:Don\'t worry, you [won\'t|don\'t|willn\'t] forget.','m:The opposite of win is [lose|fail|miss].','g:I\'m sure you {\'ll like|will like} (like) the food.','e:It will *to be>be* cold tonight.','e:I *think she won\'t>don\'t think she\'ll* come.','t:Creo que va a ganar. = I think he\'ll win.|I think he will win.|I think she\'ll win.|I think she will win.','o:Do you think it will be sunny tomorrow?']});

G({id:'2-6b',book:2,file:6,title:'will / won\'t (decisions, offers, promises)',es:'Will para decisiones, ofrecimientos y promesas',
form:[['p','Decisión instantánea: I\'ll have the chicken.'],['p','Ofrecimiento: I\'ll help you. · Shall I open the window?'],['p','Promesa: I\'ll call you tonight. I won\'t tell anyone.']],
uses:['Verbs + back: call back, come back, give back, pay back, take back.'],
ex:[['The phone\'s ringing. – I\'ll get it.','Está sonando el teléfono. – Yo contesto.'],['I\'ll pay you back tomorrow.','Te pago mañana.'],['I won\'t forget, I promise.','No lo olvidaré, lo prometo.']],
errs:[['I call you later (promesa).','I\'ll call you later.','Promesa → will.']],
items:['m:It\'s cold. – [I\'ll close|I close|I\'m closing] the window.','m:I promise I [won\'t|don\'t|willn\'t] tell anybody.','m:Can you call me [back|again|return] later?','m:I\'ll pay you [back|again|return] next week.','g:That bag looks heavy. {I\'ll help|I will help|I\'ll carry|I will carry} you. ## Ofrecimiento','e:Don\'t worry, I *call>\'ll call* you tonight.','t:Te llamo más tarde. = I\'ll call you later.|I will call you later.','o:I will give it back to you tomorrow.']});

G({id:'2-6c',book:2,file:6,title:'Review of verb forms',es:'Repaso de tiempos verbales',
form:[['i','present simple: I work · present continuous: I\'m working'],['i','past simple: I worked · past continuous: I was working'],['i','future: I\'m going to work / I\'ll work / I\'m working tomorrow'],['i','present perfect: I\'ve worked'],['i','Adjectives + prepositions: afraid of, good at, interested in, married to, different from, angry with']],
uses:['Identifica el tiempo según la señal: now, yesterday, ever, tomorrow, every day.'],
ex:[['I\'m good at math.','Soy bueno en matemáticas.'],['She\'s afraid of dogs.','Ella le tiene miedo a los perros.'],['He\'s married to a doctor.','Está casado con una doctora.']],
errs:[['married with','married to','Preposición fija.'],['good in English','good at English','good at.']],
items:['m:She\'s afraid [of|to|from] spiders.','m:I\'m not very good [at|in|on] cooking.','m:Are you interested [in|on|for] art?','m:Every morning I [have|am having|had] coffee.','m:Yesterday I [met|have met|was met] an old friend.','m:[Have you ever|Did you ever|Are you ever] been to Mexico?','g:He\'s married {to} a nurse.','e:My life is very different *of>from* yours.','t:Le tengo miedo a las alturas. = I\'m afraid of heights.|I am afraid of heights.','o:Are you good at remembering names?']});

G({id:'2-7a',book:2,file:7,title:'Uses of the infinitive (with to)',es:'Usos del infinitivo con to',
form:[['i','Después de ciertos verbos: want, need, decide, hope, plan, try, promise, learn, forget, would like + to'],['i','Para expresar propósito: I went to the bank to get money.'],['i','Después de adjetivos: It\'s easy to learn. Nice to meet you.'],['i','Después de question words: I don\'t know what to do.']],
uses:['"para" + verbo en español = <b>to</b> + verbo (no "for").'],
ex:[['I went to the store to buy milk.','Fui a la tienda para comprar leche.'],['It\'s important to sleep well.','Es importante dormir bien.'],['I don\'t know what to wear.','No sé qué ponerme.']],
errs:[['I went there for buy milk.','I went there to buy milk.','Propósito → to.'],['It\'s difficult understand.','It\'s difficult to understand.','adj + to.']],
items:['m:I\'m saving money [to buy|for buy|for buying] a car.','m:It\'s easy [to make|make|making] pupusas.','m:I don\'t know what [to say|say|saying].','m:She promised [to call|calling|call] me.','g:I went to the pharmacy {to get} (get) some aspirin.','g:Nice {to meet} (meet) you!','e:I study English *for get>to get* a better job.','e:It\'s difficult *learn>to learn* a new language.','t:No sé qué hacer. = I don\'t know what to do.','o:I called her to say happy birthday.']});

G({id:'2-7b',book:2,file:7,title:'Uses of the gerund (-ing)',es:'Usos del gerundio (-ing)',
form:[['i','Como sujeto: Walking is good for you.'],['i','Después de preposiciones: I\'m good at cooking. Thanks for coming.'],['i','Después de verbos: like, love, hate, enjoy, don\'t mind, finish, stop, spend time, feel like + -ing']],
uses:['En español usamos el infinitivo como sujeto ("Correr es sano"), en inglés -ing: <i>Running is healthy</i>.'],
ex:[['Swimming is my favorite exercise.','Nadar es mi ejercicio favorito.'],['I\'m thinking of moving.','Estoy pensando en mudarme.'],['I don\'t feel like going out.','No tengo ganas de salir.'],['She enjoys reading.','Ella disfruta leer.']],
errs:[['Smoke is bad.','Smoking is bad.','Sujeto → -ing.'],['I\'m good at to dance.','I\'m good at dancing.','Prep + -ing.'],['I enjoy to cook.','I enjoy cooking.','enjoy + -ing.']],
items:['m:[Eating|Eat|To eating] fruit is good for you.','m:I\'m interested in [learning|to learn|learn] French.','m:She enjoys [dancing|to dance|dance].','m:I don\'t feel like [going|to go|go] out tonight.','m:Have you finished [cleaning|to clean|clean] the kitchen?','g:Thanks for {helping} (help) me.','g:I spend a lot of time {studying} (study).','e:*Smoke>Smoking* is bad for your health.','e:I\'m tired of *wait>waiting*.','t:Nadar es bueno para la salud. = Swimming is good for your health.|Swimming is good for you.','o:I am thinking of changing my job.']});

G({id:'2-7c',book:2,file:7,title:'have to, don\'t have to, must, mustn\'t',es:'Obligación y prohibición',
form:[['p','have to / has to + base = tener que (obligación)'],['n','don\'t have to = no es necesario'],['p','must + base = debes (regla, obligación fuerte)'],['n','mustn\'t + base = prohibido'],['q','Do you have to…? Does she have to…?']],
uses:['<b>don\'t have to</b> ≠ <b>mustn\'t</b>: "no hace falta" vs. "está prohibido".','Pasado: had to.','Modifiers: a little, a bit, quite, really, very, incredibly.'],
ex:[['I have to wear a uniform at work.','Tengo que usar uniforme en el trabajo.'],['You don\'t have to come if you don\'t want to.','No tienes que venir si no quieres.'],['You mustn\'t smoke here.','No debes (prohibido) fumar aquí.'],['She had to work late yesterday.','Ella tuvo que trabajar tarde ayer.']],
errs:[['She have to work.','She has to work.','he/she → has to.'],['You must to study.','You must study.','must sin to.']],
items:['m:She [has to|have to|must to] get up at 5:00 every day.','m:It\'s Sunday! You [don\'t have to|mustn\'t|haven\'t to] go to work.','m:You [mustn\'t|don\'t have to|must] use your phone during the exam.','m:[Do you have to|Have you to|Must you to] wear a uniform?','m:Yesterday I [had to|must|have to] stay late at work.','g:Children {mustn\'t|must not} (prohibido) play with matches.','e:You must *to wear>wear* a seat belt.','e:My dad *have>has* to work on Saturdays.','t:Tengo que trabajar mañana. = I have to work tomorrow.','t:No tienes que pagar. = You don\'t have to pay.|You do not have to pay.','o:Do you have to work on weekends?']});

G({id:'2-8a',book:2,file:8,title:'should / shouldn\'t',es:'Consejos con should',
form:[['p','should + base (igual para todos)'],['n','shouldn\'t + base'],['q','Should I…? What should I do?'],['i','I think you should… / I don\'t think you should…']],
uses:['Dar consejos u opiniones.','Get tiene muchos significados: get a job (conseguir), get home (llegar), get tired (ponerse), get married, get better, get a message (recibir).'],
ex:[['You should see a doctor.','Deberías ver a un doctor.'],['You shouldn\'t eat so much sugar.','No deberías comer tanta azúcar.'],['What should I do?','¿Qué debería hacer?'],['I usually get home at 7.','Normalmente llego a casa a las 7.']],
errs:[['You should to rest.','You should rest.','Sin to.'],['She shoulds go.','She should go.','No cambia.']],
items:['m:You look tired. You [should|shouldn\'t|should to] go to bed.','m:You [shouldn\'t|should|don\'t should] drink coffee at night.','m:What [should I|I should|do I should] wear to the interview?','m:What time do you usually [get|arrive|go] home?','m:It\'s getting [dark|darkly|darker than] — let\'s go.','g:I don\'t think you {should} buy that car. It\'s too expensive.','e:You should *to talk>talk* to your boss.','t:Deberías ver a un doctor. = You should see a doctor.|You should go to the doctor.','o:I think you should apologize to her.']});

G({id:'2-8b',book:2,file:8,title:'First conditional',es:'Primer condicional (situaciones posibles)',
form:[['p','If + present simple, will / won\'t + base'],['i','If it rains, I\'ll stay at home. = I\'ll stay at home if it rains.'],['i','Nunca "will" después de if.']],
uses:['Situaciones reales o posibles en el futuro y su resultado.','Confusing verbs: borrow/lend, win/earn, know/meet, look/look like, carry/wear, hope/wait.'],
ex:[['If you study, you\'ll pass.','Si estudias, pasarás.'],['If I don\'t hurry, I\'ll miss the bus.','Si no me apuro, perderé el bus.'],['What will you do if you lose your job?','¿Qué harás si pierdes tu trabajo?'],['Can you lend me $10?','¿Me prestas $10?']],
errs:[['If it will rain, I\'ll stay home.','If it rains, I\'ll stay home.','if + presente.'],['Can I lend your pen?','Can I borrow your pen?','borrow = pedir prestado.']],

G({id:'2-8c',book:2,file:8,title:'Possessive pronouns',es:'Pronombres posesivos: mine, yours…',

G({id:'2-9a',book:2,file:9,title:'Second conditional',es:'Segundo condicional (situaciones imaginarias)',

uses:['Situaciones imaginarias, poco probables o irreales en el presente/futuro.','Compárala: 1.º = posible (If I have time…) · 2.º = imaginario (If I had time…).','Vocab animales: bee, butterfly, shark, snake, spider, bear, horse…'],

G({id:'2-9b',book:2,file:9,title:'Present perfect + for / since',es:'Presente perfecto con for y since',
form:[['p','I\'ve lived here for five years. / since 2019.'],['q','How long have you…?'],['i','for + periodo (for two weeks, for a long time)'],['i','since + punto de inicio (since Monday, since I was a child)']],
uses:['Acción que empezó en el pasado y SIGUE ahora.','En español: "Vivo aquí desde hace 5 años" → <i>I\'ve lived here for 5 years</i> (no "I live here since…").','Phobias: afraid of / scared of / terrified of.'],
ex:[['How long have you worked here?','¿Cuánto tiempo llevas trabajando aquí?'],['I\'ve known her since we were kids.','La conozco desde que éramos niños.'],['She\'s been afraid of dogs for years.','Le ha tenido miedo a los perros por años.']],
errs:[['I live here since 2020.','I\'ve lived here since 2020.','Sigue ahora → present perfect.'],['for 2018','since 2018','Punto de inicio → since.']],
items:['m:I\'ve had this car [for|since|ago] six years.','m:She\'s worked here [since|for|from] 2021.','m:How long [have you known|do you know|did you know] your best friend?','m:We [\'ve been|are|were] married for ten years. (y seguimos casados)','g:I\'ve been afraid of snakes {since} I was a child.','g:They\'ve lived in Santa Ana {for} a long time.','e:I *know>\'ve known* him since 2015.','e:She\'s been a teacher *since>for* twenty years.','t:¿Cuánto tiempo has vivido aquí? = How long have you lived here?','t:Vivo aquí desde 2020. = I\'ve lived here since 2020.|I have lived here since 2020.','o:How long have you studied English?']});

G({id:'2-9c',book:2,file:9,title:'Present perfect or past simple? (biographies)',es:'PP vs. pasado: personas vivas y fallecidas',

G({id:'2-10a',book:2,file:10,title:'Passive (be + past participle)',es:'Voz pasiva',

uses:['Cuando lo importante es la acción o el objeto, no quién lo hace.','Verbs: invent, discover, design, build, create, write, paint, direct.'],
ex:[['This house was built in 1950.','Esta casa fue construida en 1950.'],['English is spoken all over the world.','El inglés se habla en todo el mundo.'],['The Mona Lisa was painted by Leonardo da Vinci.','La Mona Lisa fue pintada por Leonardo da Vinci.']],

items:['m:The telephone [was invented|invented|is invent] in 1876.','m:These cars [are made|are make|make] in Japan.','m:Spanish [is spoken|speaks|is speaking] in many countries.','m:The bridge [was built|was build|built] in 1990.','g:Harry Potter {was written} (write) by J.K. Rowling.','g:Coffee {is grown} (grow) in many parts of El Salvador.','e:The Mona Lisa was *paint>painted* by Leonardo.','e:This song *wrote>was written* by Shakira.','t:Fue construido en 1950. = It was built in 1950.','t:Aquí se habla inglés. = English is spoken here.','o:The pyramids were built a long time ago.']});

G({id:'2-10b',book:2,file:10,title:'used to',es:'Used to: hábitos del pasado',

errs:[['I use to play.','I used to play.','Afirmativo: used.'],['I didn\'t used to…','I didn\'t use to…','Con did: use.']],

G({id:'2-10c',book:2,file:10,title:'might / might not',es:'Might: posibilidad',

G({id:'2-11b',book:2,file:11,title:'Phrasal verbs (word order)',es:'Phrasal verbs: orden de las palabras',

G({id:'2-11c',book:2,file:11,title:'so / neither + auxiliaries',es:'So do I / Neither do I',
form:[['p','Coincidir con algo afirmativo: I like cats. – So do I.'],['n','Coincidir con algo negativo: I don\'t like cats. – Neither do I.'],['i','El auxiliar depende del tiempo: I\'m tired → So am I · I went → So did I · I can\'t → Neither can I · I\'ve never… → Neither have I']],
uses:['Para decir "yo también" / "yo tampoco".','No estar de acuerdo: I like it. – I don\'t. / I don\'t like it. – I do.'],
ex:[['I love salsa. – So do I!','Me encanta la salsa. – ¡A mí también!'],['I\'m not hungry. – Neither am I.','No tengo hambre. – Yo tampoco.'],['I went to bed late. – So did I.','Me dormí tarde. – Yo también.']],
errs:[['I like pizza. – Me too / So I do.','So do I.','So + auxiliar + sujeto.'],['I can\'t swim. – Neither I can.','Neither can I.','Orden invertido.']],
items:['m:I\'m from El Salvador. – So [am|do|are] I.','m:I don\'t like horror movies. – Neither [do|am|don\'t] I.','m:I went to the concert. – So [did|went|was] I.','m:I can\'t dance. – Neither [can|can\'t|do] I.','m:I\'ve never been to Europe. – Neither [have|do|am] I.','g:I love chocolate. – So {do} I.','g:I wasn\'t at home. – Neither {was} I.','e:I\'m very tired. – So *do>am* I.','e:I can\'t cook. – Neither *I can>can I*.','t:A mí también. (I like coffee) = So do I.','o:I don\'t eat meat. Neither does my wife.']});

G({id:'2-12a',book:2,file:12,title:'Past perfect',es:'Pasado perfecto (había + participio)',

G({id:'2-12b',book:2,file:12,title:'Reported speech',es:'Estilo indirecto',
form:[['i','"I\'m tired." → She said (that) she was tired.'],['i','"I like it." → He said he liked it.'],['i','"I\'ll call." → She said she would call.'],['i','"I can come." → He said he could come.'],['i','say something · tell somebody something · ask (somebody)']],

ex:[['He said he was busy.','Dijo que estaba ocupado.'],['She told me she loved her job.','Me dijo que le encantaba su trabajo.'],['They said they would come.','Dijeron que vendrían.']],
errs:[['She said me…','She told me… / She said…','tell + persona.'],['He said he is tired.','He said he was tired.','Retroceso de tiempo.']],

G({id:'2-12c',book:2,file:12,title:'Questions without auxiliaries',es:'Preguntas de sujeto (sin do/did)',

function hashStr(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return ()=>{ h=Math.imul(h^h>>>16,2246822507); h=Math.imul(h^h>>>13,3266489909); return (h^=h>>>16)>>>0; }; }

function parseItem(str, topic, idx){
  const type = str[0]; let body = str.slice(2), exp = '';
  const hx = body.indexOf(' ## '); if(hx>=0){ exp = body.slice(hx+4); body = body.slice(0,hx); }
  const it = {type, topic:topic.id, key: topic.id+'#'+idx, exp};
  if(type==='m'){ const m=body.match(/\[(.+?)\]/); it.opts=m[1].split('|'); it.ans=it.opts[0]; it.pre=body.slice(0,m.index); it.post=body.slice(m.index+m[0].length); }
  else if(type==='g'){ const m=body.match(/\{(.+?)\}/); it.answers=m[1].split('|'); it.pre=body.slice(0,m.index); it.post=body.slice(m.index+m[0].length); }
  else if(type==='e'){ const m=body.match(/\*(.+?)>(.+?)\*/); it.bad=m[1]; it.fix=m[2]; it.pre=body.slice(0,m.index); it.post=body.slice(m.index+m[0].length);

  else if(type==='o'){ it.sentence=body; }
  return it;
}

}
function lev(a,b){ if(a===b) return 0; const m=a.length,n=b.length; if(!m) return n; if(!n) return m; let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; } return prev[n]; }

  for(const a of answers){ if(norm(a)===u) return {ok:true, exact:true}; }

}

      (q.normalized||[]).forEach(n=>{ for(const k in map) if(map[k]===n.from) map[k]=n.to; });
      (q.redirects||[]).forEach(n=>{ for(const k in map) if(map[k]===n.from) map[k]=n.to; });
      const thumbs={}; Object.values(q.pages||{}).forEach(p=>{ if(p.thumbnail) thumbs[p.title]=p.thumbnail.source; });
      chunk.forEach(t=>{ IMG[t]=thumbs[map[t]]||''; });
      saveJSON(IMGKEY, IMG);
    }catch(e){ /* sin internet: se queda el emoji */ }
  }
  ws.forEach(f=>f()); paintImages();
}
function paintImages(root=document){
  $$('img[data-wiki]', root).forEach(img=>{
    const u = IMG[img.dataset.wiki];
    if(u && !img.src){ img.onload=()=>img.classList.add('ok'); img.onerror=()=>img.remove(); img.src=u; }
  });
}
function imgTag(w, cls=''){ return w.wiki ? `<img data-wiki="${esc(w.wiki)}" alt="${esc(w.w)}" class="${cls}" loading="lazy">` : ''; }
function loadImagesFor(words){ const t=words.map(w=>w.wiki).filter(Boolean); if(!t.length) return; if(t.every(x=>x in IMG)){ paintImages(); return; } requestImages(t); }
/* ================== GENERADORES DE PREGUNTAS ================== */
/* Tipos: mc, type, order, err, match, listen, img */
function qFromItem(it, r=freeRng, allowVariant=true){
  const t = TOPIC[it.topic]; const base = {key:it.key, topic:it.topic, tag:unitLabel(t)+' · '+t.title};
  if(it.type==='m'){
    const promptTxt = (it.pre+it.post).replace(/[\s?.!]/g,'') ? `${esc(it.pre)}<span class="gap">___</span>${esc(it.post)}` : 'Elige la opción correcta:';
    return {...base, kind:'mc', label:'Elige la opción correcta', prompt:promptTxt, fill:{pre:it.pre,post:it.post}, opts:shuffle(it.opts,r), ans:it.ans, exp:it.exp, say:(it.pre+it.ans+it.post)};
  }
  if(it.type==='g') return {...base, kind:'type', label:'Completa el espacio', prompt:`${esc(it.pre)}<span class="gap">___</span>${esc(it.post)}`, fill:{pre:it.pre,post:it.post}, answers:it.answers, exp:it.exp, say:(it.pre+it.answers[0]+it.post).replace(/\(.*?\)\s?/g,'')};
  if(it.type==='e') return {...base, kind:'err', label:'Toca la palabra incorrecta', pre:it.pre, bad:it.bad, fix:it.fix==='—'?'(quitar)':it.fix, post:it.post, correct:it.correct, exp:it.exp, say:it.correct};
  if(it.type==='t'){
    const v = allowVariant ? r() : 0;
    if(v>0.78) return {...base, kind:'listen', label:'Dictado: escribe lo que escuchas', answers:it.answers.slice(0,1).concat(it.answers), say:it.sentence, hint:it.es};
    if(v>0.6) return {...base, kind:'order', label:'Ordena la oración', words:tokens(it.sentence), sentence:it.sentence, hint:it.es, say:it.sentence};
    return {...base, kind:'type', label:'Traduce al inglés', prompt:`<span class="lang">ES</span> ${esc(it.es)}`, answers:it.answers, say:it.sentence, showAns:it.answers[0]};
  }
  if(it.type==='o'){
    if(allowVariant && r()>0.75) return {...base, kind:'listen', label:'Dictado: escribe lo que escuchas', answers:[it.sentence], say:it.sentence};
    return {...base, kind:'order', label:'Ordena la oración', words:tokens(it.sentence), sentence:it.sentence, say:it.sentence};
  }
}
function tokens(sentence){ return sentence.replace(/[.?!]$/,'').split(' '); }

function qVocab(w, r=freeRng, kind){
  const g = GROUP[w.g]; const pool = (g.words.length>=4 ? g.words : WORDS).filter(x=>x!==w);
  const tag = 'Vocabulario · '+g.title;
  const kinds = ['img','meaning','listenword']; if(spellable(w)) kinds.push('spell','spell');
  kind = kind || pick(kinds, r);
  const d3 = shuffle(pool, r).filter((x,i,a)=>a.findIndex(y=>y.w===x.w)===i).slice(0,3);
  if(kind==='img') return {key:w.key, tag, kind:'mc', label:'¿Qué es?', visual:w, prompt:'', opts:shuffle([w.w,...d3.map(x=>x.w)],r), ans:w.w, say:w.w, exp:w.es};
  if(kind==='meaning') return {key:w.key, tag, kind:'mc', label:'¿Qué significa?', prompt:`<b>${esc(w.w)}</b> ${spk(w.w)}`, opts:shuffle([w.es,...d3.map(x=>x.es)],r), ans:w.es, say:w.w, exp:w.ex};
  if(kind==='listenword') return {key:w.key, tag, kind:'mc', label:'Escucha y elige', listen:true, prompt:'', opts:shuffle([w.w,...d3.map(x=>x.w)],r), ans:w.w, say:w.w, exp:w.es};

function qIdiom(w, r=freeRng){
  if(r()<0.5) return qVocab(w, r, 'meaning');
  const d3 = shuffle(GROUP['v-idioms'].words.filter(x=>x!==w), r).slice(0,3);
  return {key:w.key, tag:'Idioms', kind:'mc', label:'¿Qué idiom corresponde?', prompt:`“${esc(w.es)}”`, opts:shuffle([w.w,...d3.map(x=>x.w)],r), ans:w.w, say:w.ex||w.w, exp:w.ex};
}
const idiomWord = i => WORD['w:v-idioms:'+i.w];
function qMatch(words, r=freeRng){
  const ws = words.slice(0,5);
  return {key:'match', tag:'Vocabulario', kind:'match', label:'Empareja inglés y español', pairs:ws.map(w=>({a:w.w, b:w.es, key:w.key})), left:shuffle(ws.map(w=>w.w),r), right:shuffle(ws.map(w=>w.es),r)};
}
function qVerb(v, r=freeRng, kind){
  const tag='Verbos irregulares';
  kind = kind || pick(['past','past','pp','pp','mcpp','meaning'], r);
  if(kind==='past') return {key:v.key, tag, kind:'type', label:'Escribe el pasado', prompt:`<b>${v.b}</b> → <span class="gap">___</span> <span class="muted small">(${esc(v.es)})</span>`, answers:alts(v.p), say:`${v.b}, ${v.p}`, exp:`${v.b} → ${v.p} → ${v.pp}`};
  if(kind==='pp') return {key:v.key, tag, kind:'type', label:'Escribe el participio', prompt:`<b>${v.b}</b> → ${esc(v.p)} → <span class="gap">___</span>`, answers:alts(v.pp), say:`${v.b}, ${v.p}, ${v.pp}`, exp:`${v.b} → ${v.p} → ${v.pp}`};
  if(kind==='mcpp'){
    const set=new Set([v.pp.split(' / ')[0]]); const cands=[v.p.split(' / ')[0], v.b+'ed', v.b.replace(/e$/,'')+'ed', v.b+'en', v.p.split(' / ')[0]+'en', v.b];
    for(const c of shuffle(cands,r)){ if(set.size>=3) break; set.add(c); }
    const opts=[...set];
    return {key:v.key, tag, kind:'mc', label:'Elige el participio (have + ___)', prompt:`I have <span class="gap">___</span> <span class="muted small">(${v.b})</span>`, fill:{pre:'I have ',post:''}, opts:shuffle(opts,r), ans:opts[0], say:`${v.b}, ${v.p}, ${v.pp}`, exp:`${v.b} → ${v.p} → ${v.pp}`};
  }
  const d3 = shuffle(VERBS.filter(x=>x!==v),r).slice(0,3);
  return {key:v.key, tag, kind:'mc', label:'¿Qué significa?', prompt:`<b>${v.b}</b> – ${esc(v.p)} – ${esc(v.pp)} ${spk(v.b+', '+v.p+', '+v.pp)}`, opts:shuffle([v.es,...d3.map(x=>x.es)],r), ans:v.es, say:v.b, exp:''};
}
function qEd(v, r=freeRng){
  const L={t:'/t/  (worked)', d:'/d/  (played)', id:'/ɪd/  (wanted)'};
  return {key:v.key, tag:'Verbos regulares · -ed', kind:'mc', label:'¿Cómo suena la terminación -ed?', prompt:`<b>${v.p}</b> ${spk(v.p)} <span class="muted small">(${esc(v.es)})</span>`, opts:[L.t,L.d,L.id], ans:L[v.s], say:v.p, exp:'Regla: después de /t/ o /d/ → /ɪd/; después de sonidos sordos (p, k, s, sh, ch, f) → /t/; el resto → /d/.'};
}
function qFromKey(key, r=freeRng){
  if(key.startsWith('w:')){ const w=WORD[key]; return w ? qVocab(w,r) : null; }
  if(key.startsWith('v:')){ const v=VERB[key]; return v ? qVerb(v,r) : null; }
  if(key.startsWith('r:')){ const v=REGS.find(x=>x.key===key); return v ? qEd(v,r) : null; }
  const [tid, i] = key.split('#'); const t=TOPIC[tid]; if(!t || !t.parsed[+i]) return null; return qFromItem(t.parsed[+i], r);
}

/* ---------- selección diaria ---------- */
/* "foto" del progreso al inicio del día: así el mismo día siempre genera los mismos ejercicios */
function snap(){
  if(!S.snap || S.snap.date!==TODAY){ S.snap={date:TODAY, miss:{...S.miss}, acc:Object.fromEntries(GRAMMAR.map(t=>[t.id,acc(t.id)]))}; save(); }
  return S.snap;
}
function topicWeight(t){
  const s=status(t.book,t.file); let w = s==='actual'?4 : s==='visto'?2.4 : s==='base'?1.4 : 0.8;
  const a=snap().acc[t.id] ?? null; if(a!==null) w *= 1 + (1-a)*1.5; else w *= 1.15;
  return w;
}
function eligibleTopics(){ return GRAMMAR.filter(t=>eligible(t.book,t.file)); }
function eligibleWords(){ return WORDS.filter(w=>{ const g=GROUP[w.g]; return eligible(g.book,g.file); }); }
function eligibleVerbs(){ return VERBS; }

function buildDaily(){
  const r = makeRng('reto:'+TODAY), N = S.settings.daily;
  const nG = Math.round(N*0.5), nV = Math.round(N*0.2), nB = Math.round(N*0.2);
  const qs=[], usedT={}, used=new Set(), M=snap().miss;
  const tps = eligibleTopics();
  // errores pendientes primero (máx. 3)
  Object.keys(M).sort((a,b)=>M[b]-M[a] || (a<b?-1:1)).slice(0,3).forEach(k=>{ const q=qFromKey(k,r); if(q){ qs.push(q); used.add(k); } });
  let guard=0;
  while(qs.length < nG && guard++<400){
    const t = weightedPick(tps, x=>topicWeight(x)/(1+(usedT[x.id]||0)*2), r);
    const it = pick(t.parsed, r); if(used.has(it.key)) continue;
    used.add(it.key); usedT[t.id]=(usedT[t.id]||0)+1; qs.push(qFromItem(it, r));
  }
  const ws = shuffle(eligibleWords(), r);
  const wgt = w => { const g=GROUP[w.g]; const s=status(g.book,g.file); return (s==='actual'?3:s==='visto'?2:1.2) * (M[w.key]?2:1); };
  const chosenW=[]; guard=0;
  while(chosenW.length < nV && guard++<300){ const w=weightedPick(ws,wgt,r); if(!chosenW.includes(w) && !used.has(w.key)) chosenW.push(w); }
  chosenW.forEach(w=>qs.push(qVocab(w,r)));
  const vs = shuffle(eligibleVerbs(), r); const chosenV=[]; guard=0;
  while(chosenV.length < nB && guard++<300){ const v=weightedPick(vs, v=>(M[v.key]?3:1)*(v.lvl===1?1.3:1), r); if(!chosenV.includes(v) && !used.has(v.key)) chosenV.push(v); }
  chosenV.forEach((v,i)=> qs.push(i===0 && r()>0.5 ? qEd(pick(REGS,r),r) : qVerb(v,r)));
  // emparejar con un grupo del día
  const gw = shuffle(GROUP[pick(ws,r).g].words, r);
  const out = shuffle(qs, r).slice(0, N-2);
  out.splice(Math.floor(out.length/2), 0, qMatch(gw, r));
  const idw = idiomWord(r()<0.5 ? rot(IDS,'idioms') : pick(IDS, r));
  out.splice(Math.floor(out.length*0.8), 0, qIdiom(idw, r));
  return out;
}
function dailyWords(n=10){
  const r = makeRng('words:'+TODAY);
  const pool = eligibleWords();
  const due = pool.filter(w=>S.cards[w.key] && S.cards[w.key].due<=TODAY).sort((a,b)=>S.cards[a.key].b-S.cards[b.key].b);
  const fresh = shuffle(pool.filter(w=>!S.cards[w.key]), r).sort((a,b)=>{ const sa=status(GROUP[a.g].book,GROUP[a.g].file), sb=status(GROUP[b.g].book,GROUP[b.g].file); const o={actual:0,visto:1,extra:2,base:2,proximo:3}; return o[sa]-o[sb]; });
  // mezcla: hasta 6 por repasar + nuevas (mezcladas entre grupos)
  const freshMix = shuffle(fresh.slice(0, 60), r);
  return due.slice(0,6).concat(freshMix).slice(0,n);
}
function dailyVerbs(n=5){
  const r = makeRng('verbs:'+TODAY);
  const M = snap().miss;
  const miss = VERBS.filter(v=>M[v.key]).sort((a,b)=>M[b.key]-M[a.key]).slice(0,2);
  return miss.concat(shuffle(VERBS.filter(v=>!miss.includes(v)), r)).slice(0,n);
}
function topicOfDay(){ const r=makeRng('topic:'+TODAY); return weightedPick(eligibleTopics(), topicWeight, r); }
const INTERVAL=[0,1,2,4,8,16];
/* comparación flexible en español: sin tildes, sin artículos, acepta cualquier opción separada por / o coma */
function normEs(s){
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\(.*?\)/g,' ').replace(/[¿?¡!.,;:"'“”]/g,' ')
    .replace(/\b(el|la|los|las|un|una|unos|unas|to)\b/g,' ').replace(/\s+/g,' ').trim();
}
function checkEs(input, es){
  const u = normEs(input); if(!u) return {ok:false};
  const parts = [es, ...es.split(/\s*(?:\/|,|;|→|↔|–|=)\s*/)].map(normEs).filter(Boolean);
  const alts = new Set();
  parts.forEach(p=>{ alts.add(p); alts.add(p.replace(/se\b/g,'').trim()); alts.add(p.replace(/^(ser|estar|tener) /,'')); });
  const mine = [u, u.replace(/se\b/g,'').trim()];
  for(const a of alts) if(a && mine.includes(a)) return {ok:true, exact:true};
  for(const a of alts){ const tol = a.length>12 ? 2 : a.length>4 ? 1 : 0; if(tol && mine.some(x=>lev(a,x)<=tol)) return {ok:true, exact:false}; }
  return {ok:false};
}
function enAnswers(w){ return [w.w, ...w.w.split(/\s*(?:\/|→|↔|–)\s*/)].filter(Boolean); }

/* ===================== STORE: progreso basado en eventos =====================
   Fuente de verdad:
   - S.base: progreso anterior al registro de eventos (migrado de v1) y lo compactado; stat/miss/days + until.
   - S.ev:   cada respuesta es un evento {i, t, day, k, ok, tp?, q?, g?, x?}; las tareas son {i, t, day, task}.
   - S.cards: cajas Leitner {b, due, u}; S.settings (+ _u). Ambos se fusionan por fecha de cambio (u).
   S.stat, S.miss y S.days se RECALCULAN (derive) y no se guardan: así sumar eventos de varios
   dispositivos da el mismo resultado que si todo se hubiera respondido en uno solo.
*/
const KEY='aef-review-v1', IMGKEY='aef-review-imgs';
function loadJSON(k){ try{ return JSON.parse(localStorage.getItem(k)) || null; }catch(e){ return null; } }
function saveJSON(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
const RAW = loadJSON(KEY) || {};
const S = Object.assign({settings:{}, cards:{}, ev:[]}, RAW);
S.settings = Object.assign({theme:'auto', cur:1, rate:0.9, daily:15, includeNext:false, voice:'', _u:0}, S.settings);
if(!S.device) S.device = Math.random().toString(36).slice(2,8);
/* migración v1 → v2: el progreso que ya tenías pasa a ser la línea base */
if(!S.base) S.base = {stat:RAW.stat||{}, miss:RAW.miss||{}, days:RAW.days||{}, until:''};
delete S.stat; delete S.miss; delete S.days;
const IMG = loadJSON(IMGKEY) || {};

let SEQ = 0;
const SYNC = {onEvents(){}, onCard(){}, onSettings(){}, onReset(){}};   // sync.js los reemplaza
const evIds = new Set(S.ev.map(e=>e.i));

function save(){ const {stat, miss, days, ...keep} = S; if(!saveJSON(KEY, keep)){ compact(60); saveJSON(KEY, (({stat,miss,days,...k})=>k)(S)); } }
const clone = o => JSON.parse(JSON.stringify(o||{}));

/* ---------- cálculo de estadísticas ---------- */
function blankDay(){ return {q:0, ok:0, tasks:{}, cards:0}; }
function applyEvent(e, stat, miss, days){
  const d = days[e.day] = days[e.day] || blankDay(); d.tasks = d.tasks || {};
  if(e.task){ d.tasks[e.task] = true; return; }
  const st = stat[e.k] = stat[e.k] || {n:0, ok:0}; st.n++; if(e.ok) st.ok++;
  if(e.tp){ const s2 = stat[e.tp] = stat[e.tp] || {n:0, ok:0}; s2.n++; if(e.ok) s2.ok++; }
  if(e.ok){ if(miss[e.k]){ miss[e.k]--; if(miss[e.k]<=0) delete miss[e.k]; } }
  else miss[e.k] = (miss[e.k]||0) + 2;
  d.q++; if(e.ok) d.ok++; if(e.q==='flash') d.cards = (d.cards||0) + 1;
}
/* orden canónico: fecha, hora, id. Así compactar (cortar por fecha) equivale a procesar un prefijo de la misma secuencia */
const byTime = (a,b) => (a.day<b.day?-1:a.day>b.day?1:0) || a.t-b.t || (a.i<b.i?-1:a.i>b.i?1:0);
function derive(){
  const B = S.base, stat = clone(B.stat), miss = {...(B.miss||{})}, days = clone(B.days);
  S.ev.sort(byTime);
  for(const e of S.ev){ if(B.until && e.day < B.until) continue; applyEvent(e, stat, miss, days); }
  S.stat = stat; S.miss = miss; S.days = days;
}
derive();

/* compacta los eventos de más de `keepDays` días dentro de la línea base (limita el tamaño local) */
function compact(keepDays=180){
  const cut = addDays(TODAY, -keepDays); const old = S.ev.filter(e=>e.day < cut);
  if(!old.length) return false;
  const B = S.base, stat = clone(B.stat), miss = {...(B.miss||{})}, days = clone(B.days);
  old.sort(byTime).forEach(e=>{ if(!(B.until && e.day < B.until)) applyEvent(e, stat, miss, days); });
  S.base = {stat, miss, days, until: cut > (B.until||'') ? cut : B.until};
  S.ev = S.ev.filter(e=>e.day >= cut); evIds.clear(); S.ev.forEach(e=>evIds.add(e.i));
  derive(); return true;
}

/* ---------- escritura ---------- */
function newId(t){ return S.device+'.'+t.toString(36)+'.'+(SEQ++).toString(36); }
function push(e){
  S.ev.push(e); evIds.add(e.i); applyEvent(e, S.stat, S.miss, S.days);
  if(S.ev.length > 15000) compact(180);
  save(); SYNC.onEvents([e]);
}
/* registra una respuesta. info: {tp: tema, q: tipo, g: lo que respondiste, x: lo correcto} */
function record(key, ok, info={}){
  const t = Date.now(), e = {i:newId(t), t, day:TODAY, k:key, ok:ok?1:0};
  if(info.tp) e.tp = info.tp; if(info.q) e.q = info.q;
  if(!ok){ if(info.g!=null && String(info.g).trim()) e.g = String(info.g).trim().slice(0,80); if(info.x!=null) e.x = String(info.x).replace(/<[^>]+>/g,'').slice(0,80); }
  push(e);
}
function markTask(task){ if(day().tasks[task]) return; const t=Date.now(); push({i:newId(t), t, day:TODAY, task}); }
function setCard(key, b, due){ S.cards[key] = {b, due, u:Date.now()}; save(); SYNC.onCard(key, S.cards[key]); }
function touchSettings(){ S.settings._u = Date.now(); save(); SYNC.onSettings(S.settings); }

/* ---------- lectura ---------- */
const day = (d=TODAY) => (S.days[d] = S.days[d] || blankDay());
function acc(key){ const st=S.stat[key]; return st && st.n ? st.ok/st.n : null; }
function practiced(d){ const x=S.days[d]; return !!(x && (x.q>0 || x.cards>0)); }
function streak(){ let n=0, d=TODAY; if(!practiced(d)) d=addDays(d,-1); while(practiced(d)){ n++; d=addDays(d,-1); } return n; }
function bestStreak(){ const ds=Object.keys(S.days).filter(practiced).sort(); let best=0,cur=0,prev=null; ds.forEach(d=>{ cur = (prev && addDays(prev,1)===d) ? cur+1 : 1; best=Math.max(best,cur); prev=d; }); return best; }

/* ---------- fusión (sincronización, importación) ---------- */
function mergeRemote({events=[], cards={}, settings=null, base=null}={}){
  let changed = false;
  if(base && (base.until||'') >= (S.base.until||'') && JSON.stringify(base)!==JSON.stringify(S.base)){ S.base = base; changed = true; }
  for(const e of events){ if(e && e.i && !evIds.has(e.i)){ S.ev.push(e); evIds.add(e.i); changed = true; } }
  for(const k in cards){ const r=cards[k], l=S.cards[k]; if(r && (!l || (r.u||0) > (l.u||0))){ S.cards[k] = r; changed = true; } }
  if(settings && (settings._u||0) > (S.settings._u||0)){ S.settings = Object.assign({}, S.settings, settings); applyTheme(); changed = true; }
  if(changed){ derive(); save(); }
  return changed;
}
/* suma una línea base a otra (para unir el progreso anterior de dos dispositivos) */
function addBase(a, b){
  const out = {stat:clone(a.stat), miss:{...(a.miss||{})}, days:clone(a.days), until:a.until||b.until||''};
  for(const k in b.stat||{}){ const s=out.stat[k]=out.stat[k]||{n:0,ok:0}; s.n+=b.stat[k].n; s.ok+=b.stat[k].ok; }
  for(const k in b.miss||{}) out.miss[k] = Math.max(out.miss[k]||0, b.miss[k]);
  for(const d in b.days||{}){ const x=b.days[d], o=out.days[d]=out.days[d]||blankDay(); o.q+=x.q||0; o.ok+=x.ok||0; o.cards=(o.cards||0)+(x.cards||0); o.tasks=Object.assign({}, o.tasks, x.tasks); }
  return out;
}
function exportData(){ const {stat, miss, days, ...keep} = S; return {app:'english-review', v:2, exported:new Date().toISOString(), ...keep}; }
function importData(o){
  if(o && o.v===2){ mergeRemote({events:o.ev||[], cards:o.cards||{}, settings:o.settings, base:null}); if(o.base) S.base = addBase(S.base, o.base); }
  else if(o && (o.stat || o.days)){ S.base = addBase(S.base, {stat:o.stat, miss:o.miss, days:o.days}); Object.assign(S.cards, o.cards||{}); }
  else throw new Error('formato');

const SUBJ = new Set('i you he she it we they subject somebody someone'.split(' '));
const AUX = new Set("am is are was were be been being do does did don't doesn't didn't have has had haven't hasn't hadn't will won't would wouldn't can can't could couldn't should shouldn't must mustn't might going to not isn't aren't wasn't weren't 'm 're 's 've 'll 'd used there".split(' '));
const KW = new Set('verb base participle past infinitive adjective adj noun verb-ing -ing -ed +s +es -er -est wh- q aux s v o object plural singular'.split(' '));
function hl(f){
  return (f.match(/\([^)]*\)|[A-Za-z'’+\-]+|[^A-Za-z'’(+\-]+/g)||[]).map(tok=>{
    const low = tok.toLowerCase().replace(/’/g,"'");
    if(tok[0]==='(') return `<span class="tk-c">${esc(tok)}</span>`;
    if(/^[A-Za-z'’+\-]+$/.test(tok)){
      if(SUBJ.has(low)) return `<span class="tk-s">${esc(tok)}</span>`;
      if(AUX.has(low)) return `<span class="tk-a">${esc(tok)}</span>`;
      if(KW.has(low)) return `<span class="tk-k">${esc(tok)}</span>`;
      return esc(tok);
    }
    return esc(tok).replace(/·/g,'<span class="tk-p">·</span>').replace(/→/g,'<span class="tk-p">→</span>');
  }).join('');
}
const SIGN = {p:'+', n:'−', q:'?', i:'//'};

}

function tryTwister(tw){
  const btn=$('#twMic'), res=$('#twRes'); let rec;
  try{ rec=new SR(); }catch(e){ toast('Tu navegador no tiene reconocimiento de voz.'); return; }

function scoreTwister(tw, alts){
  const orig = tw.t.split(' '); let best=null;
  alts.forEach(a=>{ const pool=norm(a).split(' ');
    const hit = orig.map(w=>norm(w).split(' ').filter(Boolean).every(tok=>{ const k=pool.findIndex(x=>x===tok || (tok.length>3 && lev(x,tok)<=1)); if(k>=0){ pool.splice(k,1); return true; } return false; }));
    const sc = hit.filter(Boolean).length/orig.length; if(!best || sc>best.sc) best={sc,hit,a}; });
  $$('#twText [data-i]').forEach(sp=>{ sp.className = best.hit[+sp.dataset.i] ? 'hit' : 'miss'; });
  const p=Math.round(best.sc*100);
  const msg = p>=90?'Pronunciación clara.':p>=70?'Bien. Repite las palabras marcadas en rojo.':p>=40?'Escucha la versión lenta y repite las palabras en rojo.':'Escucha primero la versión lenta y vuelve a intentarlo.';
  $('#twRes').innerHTML = `<p class="inline-msg ${p>=70?'ok':'bad'}">${ic(p>=70?'check':'alert',16)}<span><b>${p}%</b> ${msg} Se entendió: “${esc(best.a)}”.</span></p>`;
}

function lessonTop(i, n, res, exitId){
  return `<div class="lesson-top"><div class="wrap lesson-top-in">${IB('x','Salir',`id="${exitId}"`)}
    <div class="segs" aria-label="Pregunta ${i+1} de ${n}">${Array.from({length:n},(_,k)=>`<i class="${res[k]===true?'ok':res[k]===false?'bad':k===i?'cur':''}"></i>`).join('')}</div>
    <span class="count">${Math.min(i+1,n)} / ${n}</span></div></div>`;
}
function vQuiz(){
  if(!SESSION || SESSION.type!=='quiz'){ go('ejercicios'); return; }
  const Q=SESSION; if(Q.i>=Q.qs.length) return quizResult();
  const q=Q.qs[Q.i]; Q.answered=false;
  let body='';
  const visual = q.visual ? `<div class="q-visual">${imgTag(q.visual,'')}<span class="emo">${q.visual.e}</span></div>` : '';
  const prompt = q.prompt ? `<div class="q-prompt" id="qp">${q.prompt}</div>` : '';
  if(q.kind==='mc'){
    body = `${visual}${q.listen?`<div class="listen-row"><button class="speak" data-say="${esc(q.say)}">${ic('volume',28)}<span>Escuchar</span></button></div>`:''}${prompt}
      <div class="opts" role="group">${q.opts.map((o,k)=>`<button class="opt" data-o="${esc(o)}"><span class="opt-key">${'ABCD'[k]||k+1}</span><span class="opt-txt">${esc(o)}</span><span class="opt-mark"></span></button>`).join('')}</div>`;
  } else if(q.kind==='type'){
    body = `${visual}${prompt}<input class="answer" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escribe tu respuesta" aria-label="Tu respuesta">`;
  } else if(q.kind==='listen'){
    body = `<div class="listen-row"><button class="speak" data-say="${esc(q.say)}">${ic('volume',28)}<span>Escuchar</span></button><button class="speak alt" data-say="${esc(q.say)}" data-slow="1">${ic('slow',28)}<span>Más lento</span></button></div>
      ${q.hint?`<p class="hint-row"><button class="btn text sm" id="showHint">${ic('bulb',16)}<span>Ver pista en español</span></button><span id="hint" class="hidden muted">${esc(q.hint)}</span></p>`:''}
      <input class="answer" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Escribe lo que escuchas" aria-label="Lo que escuchas">`;
  } else if(q.kind==='order'){
    const ws = q.words.map((w,i)=> i===0 && w!=='I' && !/^I'/.test(w) ? w.charAt(0).toLowerCase()+w.slice(1) : w);
    q._display = ws; q._pool = shuffle(ws.map((w,i)=>({w,i}))); q._picked=[];
    body = `${q.hint?`<div class="q-prompt"><span class="lang">ES</span> ${esc(q.hint)}</div>`:''}<div class="tiles ans" id="tAns"></div><div class="tiles pool" id="tPool"></div>`;
  } else if(q.kind==='err'){
    const toks = [...q.pre.trim().split(' ').filter(Boolean).map(w=>({w,bad:false})), {w:q.bad, bad:true}, ...q.post.trim().split(' ').filter(Boolean).map(w=>({w,bad:false}))];
    q._toks=toks;
    body = `<div class="words">${toks.map((t,i)=>`<button data-t="${i}">${esc(t.w)}</button>`).join('')}</div>`;
  } else if(q.kind==='match'){
    q._done=0; q._miss=0; q._sel=null;
    body = `<div class="match"><div class="opts">${q.left.map(a=>`<button class="opt" data-l="${esc(a)}"><span class="opt-txt">${esc(a)}</span></button>`).join('')}</div><div class="opts">${q.right.map(b=>`<button class="opt" data-r="${esc(b)}"><span class="opt-txt">${esc(b)}</span></button>`).join('')}</div></div>`;
  }
  const canCheck = ['type','listen','order'].includes(q.kind);
  app.innerHTML = `<div class="lesson">${lessonTop(Q.i, Q.qs.length, Q.res, 'qx')}
    <div class="wrap lesson-body">
      <p class="q-kicker"><span>${q.label}</span>${q.tag?`<span class="q-tag">${esc(q.tag)}</span>`:''}</p>
      ${body}
      <div class="q-tools">${q.say && q.kind!=='listen' && !q.listen ? B('Escuchar','volume','text sm','id="sayBtn" disabled title="Disponible al responder"'):''}
        ${q.topic?`<a class="btn text sm" href="#gramatica/${q.topic}" target="_blank" rel="noopener" title="Abre la estructura en otra pestaña">${ic('external',16)}<span>Ver estructura</span></a>`:''}
        ${q.kind==='mc'?'<span class="kbd-hint">Teclas 1–4</span>':''}</div>
    </div>
    <div class="action-bar ${canCheck?'':'idle'}" id="ab"><div class="wrap action-in">
      <div id="fb" class="fb" aria-live="polite"></div>
      <div class="row action-btns">${canCheck?B('No sé','','ghost','id="skip"')+B('Comprobar','check','primary','id="check"'):''}${B(Q.i+1>=Q.qs.length?'Ver resultado':'Siguiente','right','primary hidden','id="next"')}</div>
    </div></div></div>`;
  $('#qx').onclick=()=>{ SESSION=null; go('ejercicios'); };
  const sayBtn=$('#sayBtn'); if(sayBtn) sayBtn.onclick=()=>speak(q.say);
  $('#next').onclick=()=>{ Q.i++; vQuiz(); };
  if(q.visual) loadImagesFor([q.visual]);
  if(q.kind==='listen' || q.listen) setTimeout(()=>speak(q.say), 350);
  const sh=$('#showHint'); if(sh) sh.onclick=()=>{ $('#hint').classList.remove('hidden'); sh.remove(); };

  if(q.kind==='mc'){
    $$('.opt[data-o]').forEach(b=>b.onclick=()=>{
      if(Q.answered) return; const ok = b.dataset.o===q.ans;
      $$('.opt[data-o]').forEach(x=>{ x.disabled=true; if(x.dataset.o===q.ans){ x.classList.add('right'); x.querySelector('.opt-mark').innerHTML=ic('check',18); } });
      if(!ok){ b.classList.add('wrong'); b.querySelector('.opt-mark').innerHTML=ic('x',18); }
      if(q.fill && $('#qp')) $('#qp').innerHTML = `${esc(q.fill.pre)}<span class="gap filled">${esc(q.ans)}</span>${esc(q.fill.post)}`;
      finish(ok, ok?'':`La respuesta es <b>${esc(q.ans)}</b>.`, b.dataset.o, q.ans);
    });
  }
  if(q.kind==='type' || q.kind==='listen'){
    const inp=$('#ans'); setTimeout(()=>inp.focus(),50);
    const doCheck=()=>{ if(Q.answered) return; const val=inp.value; const res=checkTyped(val, q.answers); inp.disabled=true; inp.classList.add(res.ok?'right':'wrong');
      const shown = q.kind==='listen' ? q.say : (q.showAns || q.answers[0]);
      if(q.fill && $('#qp')) $('#qp').innerHTML = `${esc(q.fill.pre)}<span class="gap filled">${esc(q.answers[0])}</span>${esc(q.fill.post)}`;
      let msg = res.ok ? (res.exact?'':`Revisa la ortografía: <b>${esc(res.best)}</b>.`) : `La respuesta es <b>${esc(shown)}</b>.`;
      if(q.kind==='listen' && q.hint && res.ok) msg += ` <span class="muted">${esc(q.hint)}</span>`;
      finish(res.ok, msg, val, shown); };
    $('#check').onclick=doCheck; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); doCheck(); } };
    $('#skip').onclick=()=>{ inp.value=''; doCheck(); };
  }
  if(q.kind==='order'){
    const draw=()=>{ $('#tAns').innerHTML=q._picked.map((t,k)=>`<button class="tile" data-k="${k}">${esc(t.w)}</button>`).join('') || '<span class="muted small">Toca las palabras en orden</span>';
      $('#tPool').innerHTML=q._pool.map((t,k)=>`<button class="tile" data-p="${k}">${esc(t.w)}</button>`).join('');
      $$('[data-p]').forEach(b=>b.onclick=()=>{ if(Q.answered) return; q._picked.push(q._pool.splice(+b.dataset.p,1)[0]); draw(); });
      $$('[data-k]').forEach(b=>b.onclick=()=>{ if(Q.answered) return; q._pool.push(q._picked.splice(+b.dataset.k,1)[0]); draw(); }); };
    draw();
    const doCheck=()=>{ if(Q.answered) return; const got=q._picked.map(t=>t.w).join(' '); const ok = got.toLowerCase()===q._display.join(' ').toLowerCase();
      finish(ok, ok?esc(q.sentence):`El orden correcto es <b>${esc(q.sentence)}</b>.`, got, q.sentence); };
    $('#check').onclick=doCheck; $('#skip').onclick=()=>{ q._picked=[]; doCheck(); };
  }
  if(q.kind==='err'){
    $$('[data-t]').forEach(b=>b.onclick=()=>{ if(Q.answered) return; const t=q._toks[+b.dataset.t]; const ok=t.bad;
      $$('[data-t]').forEach(x=>{ x.disabled=true; if(q._toks[+x.dataset.t].bad) x.classList.add('right'); }); if(!ok) b.classList.add('wrong');
      finish(ok, `<b>${esc(q.bad)}</b> → <b>${esc(q.fix||'')}</b>. ${esc(q.correct)}`, t.w, `${q.bad} → ${q.fix}`); });
  }
  if(q.kind==='match'){
    const pairOf = a => q.pairs.find(p=>p.a===a);
    $$('[data-l]').forEach(b=>b.onclick=()=>{ if(b.classList.contains('gone')) return; $$('[data-l]').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); q._sel=b.dataset.l; speak(b.dataset.l); });
    $$('[data-r]').forEach(b=>b.onclick=()=>{ if(!q._sel || b.classList.contains('gone')) return; const p=pairOf(q._sel); const L=$(`[data-l="${CSS.escape(q._sel)}"]`);
      if(p.b===b.dataset.r){ [L,b].forEach(x=>{ x.classList.remove('sel'); x.classList.add('right'); setTimeout(()=>x.classList.add('gone'),250); }); q._sel=null; q._done++;
        if(q._done===q.pairs.length){ const ok=q._miss<=1; finish(ok, ok?'Todas las parejas están bien.':`Hubo ${q._miss} errores. Repasa estas palabras.`); } }
      else { q._miss++; b.classList.add('wrong'); setTimeout(()=>b.classList.remove('wrong'),400); record(p.key,false,{q:'match', g:`${p.a} = ${b.dataset.r}`, x:`${p.a} = ${p.b}`}); } });
  }

  function finish(ok, msg, given, expected){
    Q.answered=true; Q.res[Q.i]=ok; if(ok) Q.score++; else Q.wrong.push(q);
    if(q.kind!=='match') record(q.key, ok, {tp:q.topic, q:q.kind, g:given, x:expected});
    const exp = q.exp && !String(msg).includes(q.exp) ? `<span class="fb-exp">${q.exp}</span>` : '';
    $('#fb').innerHTML = `<div class="fb-in ${ok?'ok':'bad'}"><span class="fb-ic">${ic(ok?'check':'x',20)}</span><div><b>${ok?'Correcto':'Incorrecto'}</b>${msg?`<span class="fb-msg">${msg}</span>`:''}${exp}</div></div>`;
    $('#ab').classList.remove('idle'); $('#ab').classList.add(ok?'is-ok':'is-bad');
    ['check','skip'].forEach(id=>{ const x=$('#'+id); if(x) x.classList.add('hidden'); });
    const sb=$('#sayBtn'); if(sb){ sb.disabled=false; sb.title=''; }
    if(q.say && q.kind!=='match') speak(q.say);
    const nx=$('#next'); nx.classList.remove('hidden'); nx.focus();
    $$('.segs i')[Q.i].className = ok?'ok':'bad';
  }
}
document.addEventListener('keydown', e=>{
  if(!SESSION || SESSION.type!=='quiz' || e.target.tagName==='INPUT') return;
  if(e.key==='Enter' && SESSION.answered && document.activeElement?.id!=='next'){ const n=$('#next'); if(n && !n.classList.contains('hidden')){ e.preventDefault(); n.click(); } return; }
  if(!SESSION.answered && /^[1-4a-dA-D]$/.test(e.key)){ const k = /\d/.test(e.key) ? +e.key-1 : 'abcd'.indexOf(e.key.toLowerCase()); const o=$$('.opt[data-o]')[k]; if(o){ e.preventDefault(); o.click(); } }
});
function reviewLine(q){
  if(q.kind==='match') return 'Emparejar palabras';
  if(q.kind==='err') return esc(q.correct);
  if(q.kind==='order' || q.kind==='listen') return esc(q.say);
  if(q.kind==='mc') return q.fill && q.prompt ? esc(q.fill.pre)+'<b>'+esc(q.ans)+'</b>'+esc(q.fill.post) : `${q.prompt?q.prompt.replace(/<button[\s\S]*?<\/button>/g,'')+' → ':''}<b>${esc(q.ans)}</b>`;
  return q.fill ? esc(q.fill.pre)+'<b>'+esc(q.answers[0])+'</b>'+esc(q.fill.post) : (q.prompt.replace(/<[^>]+>/g,'')+' → <b>'+esc(q.showAns||q.answers[0])+'</b>');
}
function quizResult(){
  const Q=SESSION, n=Q.qs.length, p=pct(Q.score,n);
  if(Q.opts.task) markTask(Q.opts.task);
  updatePill();
  const msg = p>=90?'Dominas este contenido.':p>=70?'Buen resultado. Repasa lo que falló.':p>=50?'Vas bien, pero conviene repasar estos puntos.':'Repasa la estructura y vuelve a intentarlo.';
  app.innerHTML = `<div class="lesson">${lessonTop(n-1, n, Q.res, 'qx2')}<div class="wrap lesson-body result">
    <p class="q-kicker"><span>${esc(Q.opts.title||'Resultado')}</span></p>
    <p class="score"><b>${Q.score}</b><span>de ${n}</span></p>
    <div class="meter lg"><i style="width:${p}%"></i></div>
    <p class="lead">${p}% de aciertos. ${msg}</p>
    ${Q.wrong.length?`<h3>Para repasar</h3><ul class="review">${Q.wrong.map(q=>`<li><div><span>${reviewLine(q)}</span><small>${esc(q.tag||'')}</small></div>${q.topic?`<a class="icon-btn" href="#gramatica/${q.topic}" title="Ver estructura" aria-label="Ver estructura">${ic('book',18)}</a>`:''}</li>`).join('')}</ul>`:''}
    <div class="row result-actions">${Q.wrong.length?B('Repetir errores','repeat','primary','id="again"'):''}${B('Volver a Hoy','home','ghost','data-go="hoy"')}${B('Más ejercicios','target','ghost','data-go="ejercicios"')}</div>
  </div></div>`;
  $('#qx2').onclick=()=>go('hoy');
  const ag=$('#again'); if(ag) ag.onclick=()=>{ const ws=Q.wrong.map(q=>({...q})); startQuiz(shuffle(ws), {title:'Repetir errores'}); };
  SESSION=null;
}

/* ================== VOCABULARIO ================== */
function groupMastery(g){ const known=g.words.filter(w=>S.cards[w.key] && S.cards[w.key].b>=3).length; return known/g.words.length; }
function vVocab(arg){
  if(arg && GROUP[arg]) return vGroup(GROUP[arg]);
  const book = S.vBook || 'all'; const q = (S.vq||'').toLowerCase().trim();
  const gs = VOCAB.filter(g=>book==='all'||String(g.book)===book);
  const dw = dailyWords();
  const found = q ? WORDS.filter(w=>(w.w+' '+w.es).toLowerCase().includes(q)).slice(0,60) : [];
  const list = q
    ? `<section class="block"><div class="block-head"><h2>${found.length} resultado(s)</h2></div><div class="words-grid">${found.map(wordCard).join('')||'<p class="muted">No hay palabras con ese texto. Prueba en inglés o en español.</p>'}</div></section>`
    : `<section class="block"><div class="block-head"><h2>Palabras del día</h2>${B(day().tasks.words?'Repetir flashcards':'Empezar flashcards','cards','primary sm','data-act="words"')}</div>
        <div class="words-grid">${dw.slice(0,8).map(wordCard).join('')}</div></section>
      <section class="block"><div class="block-head"><h2>Temas</h2>
        <div class="seg">${[['all','Todos'],['B','Base'],['1','A1++'],['2','A2'],['X','Idioms']].map(([k,l])=>`<button class="${book===k?'on':''}" data-vbook="${k}">${l}</button>`).join('')}</div></div>
        <div class="groups">${gs.map(g=>{ const m=Math.round(groupMastery(g)*100); return `<button class="group" data-go="vocabulario/${g.id}">
          <span class="group-ic" aria-hidden="true">${g.icon}</span>
          <span class="group-main"><b>${esc(g.title)}</b><small>${esc(g.es)}</small><small class="muted">${g.words.length} palabras · ${bookLabel(g.book,g.file)}${status(g.book,g.file)==='actual'?' · actual':''}</small></span>
          <span class="group-side"><span class="meter"><i style="width:${m}%"></i></span><small>${m}% dominadas</small></span></button>`; }).join('')}</div></section>`;
  app.innerHTML = `<div class="wrap page">${pageHead('Vocabulario','Palabras de cada File del libro con foto, audio y un ejemplo.')}
    <label class="search">${ic('search',18)}<input id="vs" type="search" placeholder="Buscar una palabra en inglés o español" value="${esc(S.vq||'')}" aria-label="Buscar palabra"></label>${list}</div>`;
  const vs=$('#vs'); vs.oninput=()=>{ S.vq=vs.value; const pos=vs.selectionStart; vVocab(); const n=$('#vs'); n.focus(); n.setSelectionRange(pos,pos); };
  $$('[data-vbook]').forEach(b=>b.onclick=()=>{ S.vBook=b.dataset.vbook; save(); vVocab(); });
  bindActs();
  loadImagesFor(q ? found : dw.slice(0,8));
}
function wordCard(w){
  const c=S.cards[w.key];
  return `<article class="wcard"><div class="wimg">${imgTag(w)}<span class="emo" aria-hidden="true">${w.e}</span></div>
    <div class="wbody"><div class="wword"><b>${esc(w.w)}</b>${spk(w.w)}</div><span class="wes">${esc(w.es)}</span>
    ${w.ex?`<button class="wex" data-say="${esc(w.ex)}" title="Escuchar el ejemplo">${ic('play',12)}<span>${esc(w.ex)}</span></button>`:''}
    ${c?`<span class="boxes-mini" title="Caja ${c.b} de 5">${[1,2,3,4,5].map(b=>`<i class="${c.b>=b?'on':''}"></i>`).join('')}</span>`:''}</div></article>`;
}
function vGroup(g){
  app.innerHTML = `<div class="wrap page">
    <button class="back" data-go="vocabulario">${ic('left',16)}<span>Vocabulario</span></button>
    ${pageHead(`${esc(g.title)}`, `${esc(g.es)}. ${g.words.length} palabras, ${bookLabel(g.book,g.file)}.`, B('Flashcards','cards','primary','id="gFlash"')+B('Quiz de 10','target','ghost','id="gQuiz"')+B('Escuchar todo','volume','ghost','id="gSay"'))}
    <div class="words-grid">${g.words.map(wordCard).join('')}</div></div>`;
  $('#gFlash').onclick=()=>startFlash(shuffle(g.words), {title:g.title});
  $('#gQuiz').onclick=()=>{ const ws=shuffle(g.words); const qs=ws.slice(0,9).map(w=>qVocab(w)); qs.splice(4,0,qMatch(shuffle(g.words))); startQuiz(qs,{title:g.title}); };
  $('#gSay').onclick=()=>speak(g.words.map(w=>w.w).join('. '));
  loadImagesFor(g.words);
}

/* ---------- flashcards (Leitner) ---------- */
const FMODES=[['en-es','EN → ES','Escribes el significado en español'],['es-en','ES → EN','Escribes la palabra en inglés'],['quick','Rápido','Solo volteas y dices si la sabías']];
function startFlash(words, opts={}){
  if(!words.length){ toast('No hay palabras para repasar.'); return; }
  SESSION={type:'flash', words:words.slice(), i:0, total:words.length, firstOk:0, round:1, again:[], res:[], opts, mode:S.flashMode||'en-es'};
  go('flash');
}
function vFlash(){
  if(!SESSION || SESSION.type!=='flash'){ go('vocabulario'); return; }
  const F=SESSION;
  if(F.i>=F.words.length){
    if(F.again.length){ F.words=F.again; F.again=[]; F.i=0; F.round++; F.res=[]; toast('Ahora, las que fallaste.'); }
    else return flashDone();
  }
  const w=F.words[F.i]; const c=S.cards[w.key]||{b:0}; const M=F.mode;
  const pic = `${imgTag(w,'fimg')}<span class="big" aria-hidden="true">${w.e}</span>`;
  const front = M==='es-en'
    ? `${pic}<p class="fw">${esc(w.es)}</p><p class="muted small">¿Cómo se dice en inglés?</p>`
    : `${pic}<p class="fw">${esc(w.w)} ${spk(w.w)}</p><p class="muted small">${M==='quick'?'Toca la tarjeta para ver el significado':'¿Qué significa en español?'}</p>`;
  const back = `${imgTag(w,'fimg')}<div id="fres"></div><p class="fw">${esc(w.w)}</p><p class="fes">${esc(w.es)}</p>
    ${w.ex?`<p class="muted small fex">${esc(w.ex)}</p>`:''}
    <div class="row center">${spk(w.w)}${w.ex?IB('chat','Escuchar el ejemplo',`data-say="${esc(w.ex)}"`):''}</div>`;
  const controls = M==='quick'
    ? `<div class="row action-btns" id="frow">${B('Voltear','rotate','primary','id="flip"')}</div>`
    : `<input class="answer" id="fans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${M==='es-en'?'Escribe la palabra en inglés':'Escribe el significado en español'}" aria-label="Tu respuesta">
       <div class="row action-btns" id="frow">${B('No sé','','ghost','id="idk"')}${B('Comprobar','check','primary','id="chk"')}</div>`;
  app.innerHTML = `<div class="lesson">${lessonTop(F.i, F.words.length, F.res, 'fx')}
    <div class="wrap lesson-body flash-body">
      <div class="flash-head"><p class="q-kicker"><span>${esc(F.opts.title||'Flashcards')}${F.round>1?', repaso':''}</span><span class="q-tag">${esc(GROUP[w.g].title)}</span></p>
        <div class="seg">${FMODES.map(([k,l,tt])=>`<button class="${M===k?'on':''}" data-fmode="${k}" title="${tt}">${l}</button>`).join('')}</div></div>
      <div class="flash-wrap"><div class="flash" id="card"><div class="face">${front}</div><div class="face back">${back}</div></div></div>
      <p class="box-line" title="Las tarjetas suben de caja cuando aciertas; en la caja 5 vuelven cada 16 días">Caja ${c.b||0} de 5 <span class="boxes-mini">${[1,2,3,4,5].map(b=>`<i class="${c.b>=b?'on':''}"></i>`).join('')}</span></p>
      ${M==='quick'?'<p class="kbd-hint center">Espacio para voltear, 1 si no la sabías, 2 si la sabías</p>':''}
    </div>
    <div class="action-bar" id="ab"><div class="wrap action-in flash-actions">${controls}</div></div></div>`;
  loadImagesFor([w]);
  if(M!=='es-en') setTimeout(()=>speak(w.w),300);
  const cd=$('#card');
  const answer=(ok, given)=>{ const cur=S.cards[w.key]||{b:0}; const nb = ok ? Math.min(5,(cur.b||0)+1) : 1;
    setCard(w.key, nb, addDays(TODAY, ok?INTERVAL[nb]:0));
    record(w.key, ok, {q:'flash', g:given, x: M==='es-en'?w.w:w.es});
    F.res[F.i]=ok; if(ok && F.round===1) F.firstOk++; if(!ok) F.again.push(w); F.i++; vFlash(); };
  if(M==='quick'){
    const flip=()=>{ if(cd.classList.contains('flip')) return; cd.classList.add('flip');

function weekStart(d){ const dow=(parseYmd(d).getDay()+6)%7; return addDays(d,-dow); }
function weeklyData(n=12){
  const cur=weekStart(TODAY); const out=[];
  for(let k=n-1;k>=0;k--){ const ws=addDays(cur,-7*k); let q=0, ok=0, days=0;
    for(let i=0;i<7;i++){ const x=S.days[addDays(ws,i)]; if(x){ q+=x.q||0; ok+=x.ok||0; if(x.q||x.cards) days++; } }
    out.push({ws, we:addDays(ws,6), q, ok, days, p: q? Math.round(ok/q*100) : null}); }
  return out;
}
function topicTrends(){
  const a0=addDays(TODAY,-13), b0=addDays(TODAY,-27), A={}, Bm={};
  S.ev.forEach(e=>{ if(!e.tp) return; const m = e.day>=a0 ? A : e.day>=b0 ? Bm : null; if(!m) return; const s=m[e.tp]=m[e.tp]||{n:0,ok:0}; s.n++; if(e.ok) s.ok++; });
  return Object.keys(A).filter(k=>A[k].n>=3 && TOPIC[k]).map(k=>({t:TOPIC[k], n:A[k].n, p:pct(A[k].ok,A[k].n), prev: Bm[k]&&Bm[k].n>=3 ? pct(Bm[k].ok,Bm[k].n) : null})).sort((x,y)=>x.p-y.p);
}
function repeatedErrors(){
  const g={};
  S.ev.forEach(e=>{ if(e.task || e.ok || !e.g) return; const id=e.k+'|'+e.g.toLowerCase(); const r=g[id]=g[id]||{k:e.k, g:e.g, x:e.x, n:0, last:0}; r.n++; r.last=Math.max(r.last,e.t); if(e.x) r.x=e.x; });
  return Object.values(g).sort((a,b)=>b.n-a.n || b.last-a.last);
}
